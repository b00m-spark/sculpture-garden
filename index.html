<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="map-container">
        <img src="memory_map.jpg" alt="memory map">
        <div id="sound-region-water"></div>
        <div id="sound-region-leaves"></div>
        <div id="sound-region-grass"></div>
        <div id="sound-region-music"></div>
        <div id="sound-region-stairs"></div>
        <div id="sound-region-talking"></div>

        <audio id="water-audio" src="sounds/Fountain.m4a"></audio>
        <audio id="leaves-audio" src="sounds/Leaves.m4a"></audio>
        <audio id="grass-audio" src="sounds/grass.m4a"></audio>
        <audio id="music-audio" src="sounds/Music.m4a"></audio>
        <audio id="stairs-audio" src="sounds/stairs.m4a"></audio>
        <audio id="talking-audio" src="sounds/Talking.m4a"></audio>

        <audio id="walking-audio" src="sounds/Walking.m4a" loop></audio>
    </div>

    <script src="script.js"></script>   
</body>
</html>
